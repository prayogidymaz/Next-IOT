; ESP32 LoRa Gateway — Heltec / LilyGO T-Beam (SX1262 / SX1276)
[env:heltec_wifi_lora_32_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    mikalhart/TinyGPSPlus@^1.0.3
build_flags =
    -D LORA_FREQ_MHZ=915.0
    -D NODE_ID=\"DRONE-01\"
    -D LORA_TX_INTERVAL_MS=1000
    -D ENABLE_AES_ENCRYPTION=true
    -D LORA_AES_KEY_HEX=\"00112233445566778899aabbccddeeff\"
    -D MBEDTLS_AES_C

[env:ttgo_lora32_v21]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    mikalhart/TinyGPSPlus@^1.0.3
build_flags =
    -D LORA_FREQ_MHZ=868.0
    -D NODE_ID=\"DRONE-01\"
    -D LORA_TX_INTERVAL_MS=1000
    -D ENABLE_AES_ENCRYPTION=true
    -D LORA_AES_KEY_HEX=\"00112233445566778899aabbccddeeff\"
    -D MBEDTLS_AES_C
