[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
timeout = 60
timeout_method = thread
addopts = -m "not integration" --strict-markers
markers =
    integration: integration tests requiring external services or slow full-stack ops
    slow: tests that take > 10 seconds
    e2e: end-to-end tests spanning multiple services
    smoke: critical path smoke tests for CI gate
