strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
disallow_any_generics = false
disallow_any_explicit = false
disable_error_code = [
    "union-attr",
    "arg-type",
    "name-defined",
    "dict-item",
    "attr-defined",
    "index",
    "call-overload",
    "assignment",
    "operator",
    "import-untyped",
    "misc",
    "no-untyped-def",
    "type-arg",
    "valid-type",
    "call-arg",
    "return-value",
    "list-item",
    "var-annotated",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker CLI and running compose services",
]
