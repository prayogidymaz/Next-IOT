[project]
name = "next-iot-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "PGH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# tests/conftest.py sets DATABASE_URL env before importing app (isolated test DB).
"tests/conftest.py" = ["E402"]
"alembic/**" = ["ANN"]


# LEGACY RATCHET — list only shrinks. See docs/TECH_DEBT.md
"app/api/v1/*.py" = ["ANN", "B008"]
"app/audit/*.py" = ["ANN", "B008"]
"app/automation/*.py" = ["ANN", "B008"]
"app/drone_simulator/*.py" = ["ANN"]
"app/hardware/*.py" = ["ANN", "B008"]
"app/mavlink/*.py" = ["ANN", "B008"]
"app/mission/*.py" = ["ANN", "B008"]
"app/models/*.py" = ["ANN"]
"app/notifications/*.py" = ["ANN", "B008"]
"app/notifications/providers/*.py" = ["ANN"]
"app/ota/*.py" = ["ANN", "B008"]
"app/rules/*.py" = ["ANN", "B008"]
"app/system/*.py" = ["ANN", "B008"]
"app/telemetry/video_feed/*.py" = ["ANN", "B008"]
"app/tiles/*.py" = ["ANN", "B008"]
"app/seed.py" = ['ANN']
"app/seed_hardware.py" = ['ANN']
"app/seed_telemetry.py" = ['ANN']
"app/__init__.py" = ['ANN']

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_generics = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


# LEGACY RATCHET — list only shrinks. See docs/TECH_DEBT.md
