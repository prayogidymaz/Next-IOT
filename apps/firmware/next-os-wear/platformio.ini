; Next-OS Wear v1 — PlatformIO (LILYGO T-Watch S3 + simulator PC)
; Dokumentasi: docs/setup-guide.md

[platformio]
default_envs = simulator
src_dir = src

[common]
build_flags =
    -I include
    -I src
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
lib_deps =
    lvgl/lvgl@^9.1.0
    bblanchon/ArduinoJson@^7.0.4

[env:lilygo-t-watch-s3]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ${common.build_flags}
    -D NEXT_OS_HARDWARE=1
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    ${common.lib_deps}
    knolleary/PubSubClient@^2.8
    moononournation/GFX Library for Arduino@^1.5.6
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.psram_type = qio
board_build.memory_type = qio_opi
build_src_filter =
    +<*> -<../simulator>

[env:simulator]
platform = native
extra_scripts = pre:scripts/pio_sdl2_native.py
build_flags =
    ${common.build_flags}
    -D NEXT_OS_SIMULATOR=1
    -D SIMULATOR=1
    -D MOCK_MQTT=1
    -D LV_USE_SDL=1
    -D LV_COLOR_FORMAT_DEFAULT=LV_COLOR_FORMAT_RGB565
    -std=gnu++17
lib_deps =
    ${common.lib_deps}
build_src_filter =
    -<*>
    +<../simulator/main_sim.cpp>
    +<../simulator/mock_mqtt.cpp>
    +<app.cpp>
    +<mesh/>
    +<screens>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    ${common.build_flags}
    -std=gnu++17
build_src_filter =
    +<../test/>
