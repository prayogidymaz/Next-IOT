<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Universal Device Mesh architecture">
  <rect width="640" height="320" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#0f172a">Universal Device Mesh</text>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#334155">
    <rect x="40" y="60" width="100" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="90" y="88" text-anchor="middle">Sensor</text>
    <rect x="180" y="60" width="100" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="230" y="88" text-anchor="middle">Vision</text>
    <rect x="320" y="60" width="100" height="48" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="370" y="88" text-anchor="middle">Motion</text>
    <rect x="460" y="60" width="100" height="48" rx="8" fill="#fce7f3" stroke="#db2777"/>
    <text x="510" y="88" text-anchor="middle">Actuator</text>
    <path d="M140 84 H180" stroke="#64748b" marker-end="url(#arrow)"/>
    <path d="M280 84 H320" stroke="#64748b" marker-end="url(#arrow)"/>
    <path d="M420 84 H460" stroke="#64748b" marker-end="url(#arrow)"/>
    <rect x="200" y="150" width="240" height="56" rx="8" fill="#1e293b"/>
    <text x="320" y="182" text-anchor="middle" fill="#f8fafc" font-size="13">Mesh Workflow Engine</text>
    <path d="M90 108 V150" stroke="#64748b"/>
    <path d="M230 108 V150" stroke="#64748b"/>
    <path d="M370 108 V150" stroke="#64748b"/>
    <path d="M510 108 V150" stroke="#64748b"/>
    <rect x="120" y="240" width="140" height="48" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="190" y="268" text-anchor="middle">AI Copilot (ID)</text>
    <rect x="380" y="240" width="140" height="48" rx="8" fill="#ecfccb" stroke="#65a30d"/>
    <text x="450" y="268" text-anchor="middle">WhatsApp / UI</text>
    <path d="M320 206 V240" stroke="#64748b" marker-end="url(#arrow)"/>
    <path d="M320 240 H190" stroke="#64748b"/>
    <path d="M320 240 H450" stroke="#64748b"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
