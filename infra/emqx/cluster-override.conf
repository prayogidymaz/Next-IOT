# WARNING: webhook secret is hardcoded for local dev. EMQX HOCON does not expand ${VAR} from OS env.
# Production options: envsubst in entrypoint before EMQX start, init container generated config,
# or EMQX secret / Dashboard API management.
# Keep this value in sync with API MQTT_WEBHOOK_SHARED_SECRET (.env / docker-compose api service).

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://api:8000/api/v1/mqtt/auth"
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
      peerhost = "${peerhost}"
      listener = "${listener}"
      protocol = "${protocol}"
    }
    headers {
      "content-type" = "application/json"
      "x-internal-secret" = "dev-mqtt-webhook-secret"
    }
    pool_size = 8
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      method = post
      url = "http://api:8000/api/v1/mqtt/acl"
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
      headers {
        "content-type" = "application/json"
        "x-internal-secret" = "dev-mqtt-webhook-secret"
      }
      pool_size = 8
      connect_timeout = "5s"
      request_timeout = "5s"
    }
  ]
}
